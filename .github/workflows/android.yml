name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install JS dependencies
        run: npm ci

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RaonTorrent-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (휴대폰에서 바로 설치용)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          cp android/app/build/outputs/apk/release/app-release.apk RaonTorrent.apk
          gh release create "$TAG" RaonTorrent.apk \
            --title "RaonTorrent ${TAG}" \
            --notes "커밋 ${GITHUB_SHA::7} 자동 빌드 (Android 9+, arm64/armv7/x86_64)" \
            --latest

      - name: Push APK to apk-build branch
        run: |
          mkdir /tmp/apkbranch && cd /tmp/apkbranch
          git init -q -b apk-build
          cp "$GITHUB_WORKSPACE/RaonTorrent.apk" .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add RaonTorrent.apk
          git commit -q -m "APK build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk-build
